name: Validate MySQL database design

on:
  push:
    branches:
      - main
      - feedback-kickoff-2026-10-20
  pull_request:

jobs:
  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_PWD: test_password_only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Execute DDL and insert sample data
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root < Table.sql
          mysql -h 127.0.0.1 -P 3306 -u root < tests/sample_data.sql

      - name: Verify table counts and intended data
        shell: bash
        run: |
          set -euo pipefail
          mysql_cmd=(mysql -h 127.0.0.1 -P 3306 -u root --batch --skip-column-names)
          get_count() {
            "${mysql_cmd[@]}" -e "$1"
          }

          test "$(get_count "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='csc370_movie_ratings'")" = 5
          test "$(get_count "SELECT COUNT(*) FROM csc370_movie_ratings.movie")" = 3
          test "$(get_count "SELECT COUNT(*) FROM csc370_movie_ratings.movie WHERE title='Shared Title'")" = 2
          test "$(get_count "SELECT COUNT(*) FROM csc370_movie_ratings.movie_genre")" = 4
          test "$(get_count "SELECT COUNT(*) FROM csc370_movie_ratings.rating")" = 3

          echo "PASS: five tables and expected sample data, including two movies with the same title."

      - name: Verify database constraints reject invalid data
        shell: bash
        run: |
          set -euo pipefail
          mysql_cmd=(mysql -h 127.0.0.1 -P 3306 -u root csc370_movie_ratings)
          expect_rejection() {
            local label="$1"
            local statement="$2"
            if "${mysql_cmd[@]}" -e "$statement"; then
              echo "FAIL: $label was wrongly accepted"
              exit 1
            fi
            echo "PASS: $label was rejected"
          }

          expect_rejection "out-of-range rating" "INSERT INTO rating VALUES (102, 2, 6, NULL, '2026-10-20 15:00:00');"
          expect_rejection "duplicate rating for same user/movie" "INSERT INTO rating VALUES (101, 1, 5, NULL, '2026-10-20 15:00:00');"
          expect_rejection "missing user referenced by rating" "INSERT INTO rating VALUES (9999, 1, 3, NULL, '2026-10-20 15:00:00');"
          expect_rejection "missing genre referenced by movie_genre" "INSERT INTO movie_genre VALUES (1, 9999);"
          expect_rejection "duplicate username" "INSERT INTO app_user VALUES (999, 'alice_demo');"
